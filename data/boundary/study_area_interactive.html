<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartServe GIS — Study Area Inspection</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .info-box {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(8px);
      max-width: 320px;
      border: 1px solid rgba(0,0,0,0.08);
    }
    .info-box h2 {
      font-size: 16px;
      color: #1a202c;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .info-box p {
      font-size: 13px;
      color: #4a5568;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .badge-pmc {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #3498db;
      border: 2px solid #1a5276;
      border-radius: 3px;
      margin-right: 6px;
    }
    .badge-pcmc {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #2ecc71;
      border: 2px solid #145a32;
      border-radius: 3px;
      margin-right: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      font-size: 12.5px;
      font-weight: 500;
      color: #2d3748;
      margin-bottom: 6px;
    }
    .metric {
      font-size: 11px;
      color: #718096;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <div class="info-box">
    <h2>🗺️ SmartServe GIS</h2>
    <p>Study Area Boundary Verification: <strong>Pune & Pimpri-Chinchwad</strong></p>
    <div class="legend-item">
      <span class="badge-pmc"></span> Pune (PMC)
      <span class="metric">251.0 km²</span>
    </div>
    <div class="legend-item">
      <span class="badge-pcmc"></span> Pimpri-Chinchwad (PCMC)
      <span class="metric">176.7 km²</span>
    </div>
    <hr style="margin: 10px 0; border: none; border-top: 1px solid #e2e8f0;">
    <div style="font-size: 11px; color: #718096;">
      Total Area: <strong>427.3 km²</strong><br>
      CRS: <strong>EPSG:4326 (WGS 84)</strong>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([18.575, 73.845], 11);

    // Basemap: OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    // Fetch and display combined boundaries
    fetch('pmc_pcmc_combined.geojson')
      .then(res => res.json())
      .then(data => {
        const geojsonLayer = L.geoJSON(data, {
          style: function(feature) {
            const isPmc = feature.properties.municipality === 'PMC';
            return {
              color: isPmc ? '#1a5276' : '#145a32',
              weight: 2.5,
              fillColor: isPmc ? '#3498db' : '#2ecc71',
              fillOpacity: 0.35
            };
          },
          onEachFeature: function(feature, layer) {
            const props = feature.properties;
            layer.bindPopup(`
              <div style="font-size: 13px; line-height: 1.5;">
                <h4 style="margin:0 0 4px 0; color:#1a202c;">${props.municipality_name}</h4>
                <strong>Code:</strong> ${props.municipality}<br>
                <strong>Wards:</strong> ${props.num_wards}<br>
                <strong>Source:</strong> ${props.source}
              </div>
            `);
          }
        }).addTo(map);

        map.fitBounds(geojsonLayer.getBounds(), { padding: [30, 30] });
      })
      .catch(err => console.error("Error loading boundary geojson:", err));
  </script>
</body>
</html>
